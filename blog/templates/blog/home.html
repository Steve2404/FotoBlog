{% extends 'base.html' %}
{% block content %}
    <h2>Blog</h2>
    <div class="grid-container">
        {% for blog in blogs%}
            <div class="post">
                <a href="{% url 'view_blog' blog_id=blog.id %}">
                    <h4>Billet: {{ blog.title }}</h4>
                    <img src="{{ blog.photo.image.url }}" alt="{{ blog.photo.caption }}">
                </a>
                <p>{{ blog.photo.caption }}</p>
            </div>
        {% endfor %}
    </div>
    

{% endblock %}
